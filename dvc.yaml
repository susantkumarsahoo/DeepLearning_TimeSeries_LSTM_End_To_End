stages:
  data_ingestion:
    cmd: python src/pipelines/data_ingestion_pipeline.py
    deps:
      - src/constants/paths.py
      - src/utils/helpers.py
      - src/entity/components_config_entity.py
      - src/components/data_ingestion.py
      - data/raw/Energy Demand Hourly.csv
    outs:
      - artifacts/data_ingestion/processed/processed_data.csv
      - artifacts/data_ingestion/split/train.csv
      - artifacts/data_ingestion/split/test.csv
      - artifacts/data_ingestion/metadata.json
      - artifacts/data_ingestion/schema.json

  data_validation:
    cmd: python src/pipelines/data_validation_pipeline.py
    deps:
      - src/constants/paths.py
      - src/utils/helpers.py
      - src/utils/handler.py
      - src/entity/components_config_entity.py
      - src/components/data_validation.py
      - artifacts/data_ingestion/processed/processed_data.csv
      - artifacts/data_ingestion/split/train.csv
      - artifacts/data_ingestion/split/test.csv
      - artifacts/data_ingestion/schema.json
    outs:
      - artifacts/data_validation/validation_status.json

  data_preprocessing:
    cmd: python src/pipelines/data_preprocessing_pipeline.py
    deps:
      - src/constants/paths.py
      - src/utils/helpers.py
      - src/utils/handler.py
      - src/utils/pre_helper.py
      - src/entity/components_config_entity.py
      - src/components/data_preprocessing.py
      - artifacts/data_ingestion/split/train.csv
      - artifacts/data_ingestion/split/test.csv
      - artifacts/data_validation/validation_status.json
    outs:
      - artifacts/data_preprocessing/train_preprocessed.csv
      - artifacts/data_preprocessing/test_preprocessed.csv

  feature_engineering:
    cmd: python src/pipelines/feature_engineering_pipeline.py
    deps:
      - src/constants/paths.py
      - src/utils/helpers.py
      - src/utils/features_engineering_helpers.py
      - src/entity/components_config_entity.py
      - src/components/feature_engineering.py
      - artifacts/data_preprocessing/train_preprocessed.csv
      - artifacts/data_preprocessing/test_preprocessed.csv
    outs:
      - artifacts/feature_engineering/test_features.csv
      - artifacts/feature_engineering/train_features.csv













      


  