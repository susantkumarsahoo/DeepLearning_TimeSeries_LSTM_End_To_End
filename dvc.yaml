stages:
  data_ingestion:
    cmd: python src/pipelines/data_ingestion_pipeline.py
    deps:
      - src/pipelines/data_ingestion_pipeline.py
      - src/components/data_ingestion.py
      - data/raw
    outs:
      - artifacts/data_ingestion


  data_validation:
    cmd: python src/pipelines/data_validation_pipeline.py
    deps:
      - src/pipelines/data_validation_pipeline.py
      - src/components/data_validation.py
      - artifacts/data_ingestion
    outs:
      - artifacts/data_validation

  data_preprocessing:
    cmd: python src/pipelines/data_preprocessing_pipeline.py
    deps:
      - src/pipelines/data_preprocessing_pipeline.py
      - src/components/data_preprocessing.py
      - artifacts/data_ingestion
      - artifacts/data_validation
    outs:
      - artifacts/data_preprocessing




      


  